<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniSimmy3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .modal { box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
    .inspector-label { font-size: 10px; letter-spacing: 0.5px; color: #64748b; text-transform: uppercase; }
    .top-stat { transition: all 0.1s ease; }
  </style>
</head>
<body class="bg-[#0a0a0f] text-[#e0e0ea]">
  <div class="max-w-screen-2xl mx-auto p-4">
    <!-- Top Bar -->
    <div class="flex items-center justify-between mb-3 px-2">
      <div class="flex items-center gap-x-4">
        <div class="flex items-center gap-x-3">
          <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center">
            <i class="fa-solid fa-atom text-[#05070f] text-2xl"></i>
          </div>
          <div>
            <span class="font-display text-3xl tracking-tighter font-semibold">MiniSimmy3</span>
            <span class="ml-2 text-xs px-2 py-0.5 bg-emerald-500/20 text-emerald-400 rounded-full font-mono">v0.25</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-x-6 text-sm">
        <div class="flex items-center gap-x-4">
          <div class="flex items-baseline gap-x-1.5 top-stat">
            <span class="text-white/50 text-xs">POP</span>
            <span id="stat-pop" class="font-mono font-semibold text-emerald-400 text-lg">18</span>
          </div>
          <div class="flex items-baseline gap-x-1.5 top-stat">
            <span class="text-white/50 text-xs">TIME</span>
            <span id="stat-time" class="font-mono font-semibold text-emerald-400 text-lg">00:00</span>
          </div>
        </div>

        <div class="h-5 w-px bg-white/10"></div>

        <div class="flex items-center gap-x-4">
          <div class="flex items-baseline gap-x-1.5 top-stat">
            <span class="text-white/50 text-xs">HRP</span>
            <span id="stat-score" class="font-mono font-semibold text-amber-400 text-lg">0</span>
          </div>
          <div class="flex items-baseline gap-x-1.5 top-stat">
            <span class="text-pink-400/70 text-xs">AETH</span>
            <span id="stat-crystals" class="font-mono font-semibold text-pink-400 text-lg">0</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-x-2">
        <button onclick="showInventory()"
                class="flex items-center gap-x-2 px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded-2xl text-xs font-medium transition-all active:scale-[0.985]">
          <i class="fa-solid fa-box"></i>
          <span>Inventory</span>
          <span id="egg-count-badge" class="ml-1 px-1.5 py-px bg-white/20 rounded text-[10px] font-mono">0/10</span>
        </button>

        <button onclick="showGeneVault()"
                class="flex items-center gap-x-2 px-4 py-2 bg-violet-600 hover:bg-violet-700 rounded-2xl text-xs font-medium transition-all active:scale-[0.985]">
          <i class="fa-solid fa-dna"></i>
          <span>Gene Vault</span>
        </button>

        <button onclick="showFurnaceModal()"
                class="flex items-center gap-x-2 px-4 py-2 bg-orange-600 hover:bg-orange-700 rounded-2xl text-xs font-medium transition-all active:scale-[0.985]">
          <i class="fa-solid fa-fire"></i>
          <span>Furnace</span>
        </button>

        <button onclick="prestige()"
                class="flex items-center gap-x-2 px-4 py-2 bg-amber-500 hover:bg-amber-600 rounded-2xl text-xs font-semibold text-[#05070f] transition-all active:scale-[0.985]">
          <i class="fa-solid fa-sync-alt"></i>
          <span>Prestige</span>
        </button>

        <div class="flex items-center bg-[#121218] border border-white/10 rounded-2xl p-1 text-xs ml-2">
          <button onclick="setTimeScale(0.5)" class="px-3 py-1.5 rounded-xl hover:bg-white/10">0.5×</button>
          <button onclick="setTimeScale(1)" class="px-3 py-1.5 rounded-xl bg-emerald-500 text-[#05070f] font-semibold">1×</button>
          <button onclick="setTimeScale(2)" class="px-3 py-1.5 rounded-xl hover:bg-white/10">2×</button>
          <button onclick="togglePause()" id="pause-btn" class="px-3 py-1.5 rounded-xl hover:bg-white/10 flex items-center gap-x-1.5 ml-1">
            <i class="fa-solid fa-pause text-xs"></i>
            <span id="pause-text" class="text-xs">Pause</span>
          </button>
        </div>
      </div>
    </div>

    <div id="canvas-container" class="mx-auto w-[820px] rounded-3xl border border-white/10 overflow-hidden shadow-2xl"></div>

    <!-- Inspector -->
    <div id="inspector" class="hidden mt-3 mx-auto w-[820px] bg-[#121218] border border-white/10 rounded-2xl p-4">
      <div class="flex justify-between items-start mb-3">
        <div>
          <div id="inspect-name" class="font-semibold text-emerald-400 text-xl"></div>
          <div id="inspect-role" class="text-xs text-white/60"></div>
        </div>
        <button onclick="deselectCreature()" class="text-sm px-3 py-1 bg-white/10 hover:bg-white/20 rounded-xl">Close</button>
      </div>

      <div class="grid grid-cols-3 gap-3 text-sm mb-3">
        <div>
          <div class="inspector-label">Generation</div>
          <div id="inspect-gen" class="font-mono text-lg"></div>
        </div>
        <div>
          <div class="inspector-label">Energy</div>
          <div id="inspect-energy" class="font-mono text-lg text-emerald-400"></div>
        </div>
        <div>
          <div class="inspector-label">Modules</div>
          <div id="inspect-module-count" class="font-mono text-lg"></div>
        </div>
      </div>

      <div>
        <div class="inspector-label mb-1">Modules</div>
        <div id="inspect-modules" class="text-xs bg-white/5 rounded-xl p-2.5 max-h-20 overflow-auto space-y-0.5"></div>
      </div>
    </div>

    <!-- Gene Vault Modal -->
    <div id="gene-vault-modal" onclick="hideGeneVault()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
      <div onclick="event.stopImmediatePropagation()" class="modal bg-[#121218] border border-white/10 rounded-3xl max-w-4xl w-full mx-4 p-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-xl font-semibold flex items-center gap-x-2">
              <i class="fa-solid fa-dna text-violet-400"></i>
              <span>Gene Vault</span>
            </h3>
            <p class="text-sm text-white/50">Preserve powerful bloodlines across prestige</p>
          </div>
          <button onclick="hideGeneVault()" class="text-3xl leading-none text-white/60 hover:text-white">&times;</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="gene-vault-slots">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>

    <!-- Inventory Modal -->
    <div id="inventory-modal" onclick="hideInventory()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
      <div onclick="event.stopImmediatePropagation()" class="modal bg-[#121218] border border-white/10 rounded-3xl max-w-md w-full mx-4 p-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-xl font-semibold flex items-center gap-x-2">
              <i class="fa-solid fa-box text-amber-400"></i>
              <span>Inventory</span>
            </h3>
            <p class="text-sm text-white/50">Stored eggs (max 10)</p>
          </div>
          <button onclick="hideInventory()" class="text-3xl leading-none text-white/60 hover:text-white">&times;</button>
        </div>

        <div id="inventory-list" class="space-y-2 max-h-[420px] overflow-auto pr-1">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>

    <!-- Furnace Modal -->
    <div id="furnace-modal" onclick="hideFurnaceModal()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
      <div onclick="event.stopImmediatePropagation()" class="modal bg-[#121218] border border-white/10 rounded-3xl max-w-sm w-full mx-4 p-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-xl font-semibold flex items-center gap-x-2">
              <i class="fa-solid fa-fire text-orange-400"></i>
              <span>Furnace</span>
            </h3>
            <p class="text-sm text-white/50">Burn Aetherium for score multiplier</p>
          </div>
          <button onclick="hideFurnaceModal()" class="text-3xl leading-none text-white/60 hover:text-white">&times;</button>
        </div>

        <div class="space-y-3">
          <div class="bg-white/5 rounded-2xl p-4">
            <div class="flex justify-between text-sm">
              <span class="text-white/50">Your Crystals</span>
              <span id="furnace-crystals" class="font-mono font-semibold text-pink-400">0</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="burnCrystals(1)" class="px-4 py-2.5 bg-orange-500/90 hover:bg-orange-500 rounded-2xl text-sm font-medium">Burn 1 Crystal</button>
            <button onclick="burnCrystals(5)" class="px-4 py-2.5 bg-orange-500/90 hover:bg-orange-500 rounded-2xl text-sm font-medium">Burn 5 Crystals</button>
          </div>

          <div class="text-xs text-center text-white/40 pt-2">
            While burning: <span class="text-orange-400 font-semibold">x100</span> score multiplier for 5 minutes
          </div>
        </div>

        <div class="mt-4 flex justify-end">
          <button onclick="hideFurnaceModal()" class="px-4 py-2 text-sm bg-white/10 hover:bg-white/20 rounded-2xl">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
