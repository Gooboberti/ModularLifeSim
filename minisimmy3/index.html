<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniSimmy3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#0a0a0f] text-[#e0e0ea]">
  <div class="max-w-screen-2xl mx-auto p-4">
    <!-- Top Bar -->
    <div class="flex items-center justify-between mb-3 px-2">
      <div class="flex items-center gap-x-3">
        <div class="flex items-center gap-x-2">
          <div class="w-8 h-8 rounded-2xl bg-gradient-to-br from-cyan-400 to-sky-500 flex items-center justify-center">
            <i class="fa-solid fa-atom text-[#05070f]"></i>
          </div>
          <span class="font-display text-2xl tracking-tighter">MiniSimmy3</span>
        </div>
        <span class="text-xs px-2.5 py-0.5 bg-sky-500/20 text-sky-400 rounded-full font-mono">v0.17</span>
      </div>

      <div class="flex items-center gap-x-4 text-sm">
        <div class="flex items-center gap-x-1.5">
          <span class="text-white/50">Pop</span>
          <span id="stat-pop" class="font-mono font-semibold text-emerald-400">18</span>
        </div>
        <div class="flex items-center gap-x-1.5">
          <span class="text-white/50">Time</span>
          <span id="stat-time" class="font-mono font-semibold">00:00</span>
        </div>
        <!-- High Roller Points -->
        <div class="flex items-center gap-x-1.5 px-3 py-1 bg-white/5 border border-white/10 rounded-2xl">
          <span class="text-white/50 text-xs">HRP</span>
          <span id="stat-score" class="font-mono font-semibold text-amber-400">0</span>
        </div>
        <!-- Aetherium Crystals -->
        <div class="flex items-center gap-x-1.5 px-3 py-1 bg-pink-500/10 border border-pink-500/30 rounded-2xl">
          <i class="fa-solid fa-gem text-pink-400 text-xs"></i>
          <span id="stat-crystals" class="font-mono font-semibold text-pink-400">0</span>
        </div>
      </div>

      <div class="flex items-center gap-x-2">
        <button onclick="showInventory()"
                class="flex items-center gap-x-1.5 px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 rounded-2xl text-xs font-medium transition-colors">
          <i class="fa-solid fa-box"></i>
          <span>Inventory</span>
          <span id="egg-count-badge" class="ml-1 px-1.5 py-0.5 bg-white/20 rounded-full text-[10px] font-mono">0/10</span>
        </button>

        <button onclick="showGeneVault()"
                class="flex items-center gap-x-1.5 px-3.5 py-1.5 bg-violet-600 hover:bg-violet-700 rounded-2xl text-xs font-medium transition-colors">
          <i class="fa-solid fa-dna"></i>
          <span>Gene Vault</span>
        </button>

        <button onclick="prestige()"
                class="flex items-center gap-x-1.5 px-4 py-1.5 bg-amber-500 hover:bg-amber-600 rounded-2xl text-xs font-semibold text-[#05070f] transition-colors">
          <i class="fa-solid fa-sync-alt"></i>
          <span>Prestige</span>
        </button>

        <div class="flex items-center gap-x-1 bg-[#121218] border border-white/10 rounded-2xl p-1 text-xs">
          <button onclick="setTimeScale(0.5)" class="px-3 py-1 rounded-xl hover:bg-white/10">0.5×</button>
          <button onclick="setTimeScale(1)" class="px-3 py-1 rounded-xl bg-emerald-500 text-[#05070f] font-semibold">1×</button>
          <button onclick="setTimeScale(2)" class="px-3 py-1 rounded-xl hover:bg-white/10">2×</button>
          <button onclick="togglePause()" id="pause-btn" class="px-3 py-1 rounded-xl hover:bg-white/10 flex items-center gap-x-1.5">
            <i class="fa-solid fa-pause text-xs"></i>
            <span id="pause-text">Pause</span>
          </button>
        </div>
      </div>
    </div>

    <div id="canvas-container" class="mx-auto w-[820px] rounded-3xl border border-white/10 overflow-hidden shadow-2xl"></div>

    <!-- Inspector -->
    <div id="inspector" class="hidden mt-3 mx-auto w-[820px] bg-[#121218] border border-white/10 rounded-2xl p-4">
      <div class="flex justify-between items-start mb-3">
        <div>
          <div id="inspect-name" class="font-semibold text-emerald-400 text-xl"></div>
          <div id="inspect-role" class="text-xs text-white/60"></div>
        </div>
        <button onclick="deselectCreature()" class="text-sm px-3 py-1 bg-white/10 hover:bg-white/20 rounded-xl">Close</button>
      </div>

      <div class="grid grid-cols-3 gap-3 text-sm mb-3">
        <div><span class="text-white/50 text-xs">Generation</span><br><span id="inspect-gen" class="font-mono"></span></div>
        <div><span class="text-white/50 text-xs">Energy</span><br><span id="inspect-energy" class="font-mono text-emerald-400"></span></div>
        <div><span class="text-white/50 text-xs">Modules</span><br><span id="inspect-module-count" class="font-mono"></span></div>
      </div>

      <div>
        <div class="text-xs text-white/50 mb-1">Modules</div>
        <div id="inspect-modules" class="text-xs bg-[#0a0a0f] border border-white/10 rounded-xl p-2 max-h-20 overflow-auto"></div>
      </div>
    </div>

    <!-- Gene Vault Modal -->
    <div id="gene-vault-modal" onclick="hideGeneVault()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
      <div onclick="event.stopImmediatePropagation()" class="modal bg-[#121218] border border-white/10 rounded-3xl max-w-4xl w-full mx-4 p-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-xl font-semibold flex items-center gap-x-2">
              <i class="fa-solid fa-dna text-violet-400"></i>
              <span>Gene Vault</span>
            </h3>
            <p class="text-sm text-white/50">Preserve powerful bloodlines across prestige</p>
          </div>
          <button onclick="hideGeneVault()" class="text-3xl leading-none text-white/60 hover:text-white">&times;</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="gene-vault-slots">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>

    <!-- Inventory Modal -->
    <div id="inventory-modal" onclick="hideInventory()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
      <div onclick="event.stopImmediatePropagation()" class="modal bg-[#121218] border border-white/10 rounded-3xl max-w-md w-full mx-4 p-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-xl font-semibold flex items-center gap-x-2">
              <i class="fa-solid fa-box text-amber-400"></i>
              <span>Inventory</span>
            </h3>
            <p class="text-sm text-white/50">Stored eggs (max 10)</p>
          </div>
          <button onclick="hideInventory()" class="text-3xl leading-none text-white/60 hover:text-white">&times;</button>
        </div>

        <div id="inventory-list" class="space-y-2 max-h-[420px] overflow-auto pr-1">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
